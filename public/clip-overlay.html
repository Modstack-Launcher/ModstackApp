<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modstack Clip</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .toast {
        width: 304px;
        height: 90px;
        display: flex;
        overflow: hidden;
        color: white;
        border: 1px solid rgba(155, 188, 255, 0.36);
        border-radius: 16px;
        background:
          radial-gradient(circle at top left, rgba(155, 188, 255, 0.24), transparent 42%),
          rgba(8, 13, 24, 0.96);
        box-shadow:
          0 22px 55px rgba(0, 0, 0, 0.55),
          0 0 36px rgba(155, 188, 255, 0.22);
        animation:
          enter 180ms ease-out both,
          exit 220ms ease-in 3.95s both;
      }

      .accent {
        width: 6px;
        flex: 0 0 auto;
        background: var(--accent, #9bbcff);
        box-shadow: 0 0 18px var(--accent, #9bbcff);
      }

      .content {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 26px;
      }

      .thumb {
        width: 72px;
        height: 40px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #090d16;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .fallback {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.72);
        background: linear-gradient(135deg, rgba(155, 188, 255, 0.28), rgba(25, 32, 52, 1));
      }

      .title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 1.2;
        white-space: nowrap;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes exit {
        to {
          opacity: 0;
          transform: translateX(24px);
        }
      }
    </style>
  </head>
  <body>
    <div class="toast">
      <div class="accent"></div>
      <div class="content">
        <div class="thumb" id="thumb"><div class="fallback">▶</div></div>
        <p class="title" id="title">Clip guardado con éxito</p>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const thumbPath = params.get("thumb");
      const title = params.get("title") || "Clip guardado con éxito";
      const accent = params.get("accent") || "#9bbcff";
      document.documentElement.style.setProperty("--accent", accent);
      document.getElementById("title").textContent = title;

      if (thumbPath && window.__TAURI_INTERNALS__?.convertFileSrc) {
        const image = document.createElement("img");
        image.alt = "Clip thumbnail";
        image.src = window.__TAURI_INTERNALS__.convertFileSrc(thumbPath, "asset");
        const thumb = document.getElementById("thumb");
        thumb.replaceChildren(image);
      }
    </script>
  </body>
</html>
