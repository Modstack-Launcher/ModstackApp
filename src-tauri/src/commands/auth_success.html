<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modstack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: #121212; color: #fff; padding: 16px;
  }

  @keyframes kaboom {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.25) rotate(8deg); }
    80%  { transform: scale(0.92) rotate(-4deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-420px) rotate(720deg); opacity: 0; }
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-ring {
    0%   { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .ext-wrap {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 340px; max-width: 520px;
    padding: 2.5rem 1rem 2rem; position: relative; text-align: center;
  }

  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

  .bit {
    position: absolute; width: 10px; height: 10px;
    border-radius: 2px; animation: floatUp linear both;
  }

  .icon-stack {
    --tone: #1D9E75;
    position: relative; width: 96px; height: 96px; margin-bottom: 1.5rem;
    animation: kaboom 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
  }
  body[data-status="error"] .icon-stack { --tone: #D85A30; }

  .pulse {
    position: absolute; inset: 0; border-radius: 50%;
    background: var(--tone); animation: pulse-ring 1.1s ease-out 0.5s infinite;
  }
  .pulse2 { animation-delay: 0.8s; }
  body[data-status="error"] .pulse { display: none; }

  .icon-circle {
    position: absolute; inset: 0; border-radius: 50%;
    background: var(--tone); display: flex;
    align-items: center; justify-content: center;
  }
  .icon-circle svg { width: 44px; height: 44px; }
  .icon-error { display: none; }
  body[data-status="error"] .icon-ok { display: none; }
  body[data-status="error"] .icon-error { display: block; }

  .big-title {
    font-size: 28px; font-weight: 600; margin: 0 0 0.6rem;
    animation: fadeSlide 0.4s 0.35s ease both;
  }

  .sub {
    font-size: 15px; line-height: 1.5; color: #b5b5b5;
    animation: fadeSlide 0.4s 0.5s ease both;
  }

  .open {
    margin-top: 1.75rem; padding: 12px 22px; border: 0; border-radius: 12px;
    background: #7F77DD; color: #fff; font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    animation: fadeSlide 0.4s 0.65s ease both;
  }
  .open:hover { background: #6c64cf; }
</style>
</head>
<body data-status="__MODSTACK_STATUS__">

<div class="ext-wrap">
  <div class="confetti-layer" id="confetti"></div>

  <div class="icon-stack">
    <div class="pulse"></div>
    <div class="pulse pulse2"></div>
    <div class="icon-circle">
      <svg class="icon-ok" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="7" x2="12" y2="13"/>
        <circle cx="12" cy="17" r="0.6" fill="#fff"/>
      </svg>
    </div>
  </div>

  <p class="big-title">__MODSTACK_TITLE__</p>
  <p class="sub">__MODSTACK_MESSAGE__</p>

  <a class="open" id="open" href="modstack://login">__MODSTACK_OPEN__</a>
</div>

<script>
  const success = document.body.dataset.status === "success";

  // Navigating to modstack:// makes the browser show its native
  // "Open Modstack?" prompt, which brings the launcher to the front.
  // The launcher also focuses itself, so this is only a convenience.
  if (success) {
    setTimeout(() => { window.location.href = "modstack://login"; }, 700);

    const colors = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#EF9F27','#378ADD','#639922'];
    const layer = document.getElementById('confetti');
    for (let i = 0; i < 38; i++) {
      const b = document.createElement('div');
      b.className = 'bit';
      const size = 7 + Math.random() * 10;
      b.style.cssText = [
        `left:${10 + Math.random() * 80}%`,
        `bottom:${-50 + Math.random() * 50}px`,
        `width:${size}px`,
        `height:${size}px`,
        `background:${colors[Math.floor(Math.random() * colors.length)]}`,
        `border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`,
        `animation-duration:${1.2 + Math.random() * 1.6}s`,
        `animation-delay:${0.2 + Math.random() * 0.8}s`,
        `opacity:0`
      ].join(';');
      layer.appendChild(b);
    }
  }
</script>

</body>
</html>
